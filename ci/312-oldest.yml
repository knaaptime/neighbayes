# Oldest supported environment.
#
# This file exists to make the lower bounds in pyproject.toml real: an
# untested floor is not a floor.  Pins here must track the ``dependencies``
# there — if you raise one, raise the other.
#
# It previously pinned only ``python=3.12`` and listed ``arviz`` twice (once
# capped, once free), so it tested "3.12 plus latest everything" and no
# minimum was ever exercised.
name: test
channels:
  - conda-forge
dependencies:
  - python=3.12
  # runtime floors — keep in sync with pyproject.toml
  - pymc=6.3
  - pytensor=3.3.2
  - arviz=1.2  # arviz-plots 1.1 fails to import under matplotlib >= 3.11
  - libpysal=4.9
  - formulaic=1.2  # 1.0 and 1.1 cannot build a design from a GeoDataFrame
  - lazy_loader=0.4
  - numpy=2.1
  - scipy=1.15
  - pandas=2.2
  - polyagamma=2.0
  - scikit-sparse=0.5
  # test-only and optional extras float: this job pins the runtime floor,
  # not the developer toolchain
  - spreg
  - statsmodels
  - geopandas
  - geodatasets
  - codecov
  - coverage
  - pytest
  - pytest-cov
  - pytest-mpl
  - pytest-xdist
  - openpyxl
  - fastprogress
  - nutpie
  - pip
  - pip:
    # jax >= 0.11.1 (sparsax, augax) needs numpy >= 2.1 and scipy >= 1.15;
    # without these pins pip upgrades both to their latest releases.
    - numpy==2.1.*
    - scipy==1.15.*
    - jax # force from pip to allow windows
    - augax
    - blackjax
    - numpyro
    - sparsax
    - equinox
